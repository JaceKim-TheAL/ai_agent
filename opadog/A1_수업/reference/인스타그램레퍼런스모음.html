<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인스타그램 릴스 · 카드뉴스 레퍼런스 26개</title><style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#e9edf7;background:#10131b}*{box-sizing:border-box}body{margin:0;padding:40px 20px}.wrap{max-width:1000px;margin:auto}h1{font-size:30px;margin:0 0 8px}p{color:#aab3c7;line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}input,button{font:inherit;border-radius:10px;padding:12px 15px}input{flex:1;min-width:220px;border:1px solid #41495a;background:#1c2230;color:white}button{background:#293448;color:#fff;border:1px solid #41495a;cursor:pointer}button.active{background:#5165b5}h2{font-size:20px;margin-top:35px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1c2230;border:1px solid #343e50;border-radius:13px;padding:15px;text-decoration:none;color:#f5f6fb;transition:.15s}.item:hover{border-color:#8ca3ff;background:#27314b;transform:translateY(-2px)}.handle{font-weight:700;overflow-wrap:anywhere}.go{font-size:12px;white-space:nowrap;color:#b5c6ff}.small{font-size:13px;color:#9aa7bc}footer{margin-top:30px;color:#8995aa;font-size:12px}@media(max-width:550px){body{padding:25px 14px}h1{font-size:23px}}
</style></head><body><main class="wrap"><h1>📌 인스타그램 레퍼런스 모음</h1><p>원페이지 릴스 · 카드뉴스 참고 계정 26개<br>계정 카드를 클릭하면 인스타그램 해당 페이지가 새 탭에서 열립니다.</p><div class="toolbar"><input id="search" type="search" placeholder="계정명 검색 (예: money, ai, apt)" aria-label="계정 검색"><button class="active" data-filter="all">전체 26</button><button data-filter="reels">릴스·카드뉴스 23</button><button data-filter="cards">카드뉴스 전문 3</button></div><div id="content"></div><footer>제공받은 링크를 그대로 사용했습니다. 계정의 변경·삭제 여부는 확인되지 않았습니다.</footer></main><script>
const reels=['numbers_talk_0','money_life_bal','helloheidi.trip','moni.toon..v','dasonibook','grow.day','trend_elf2','h0ney_news','workhack_daily','hot___click','jinro.n.lab','6a___best','apt_lap','careet.official','mylife_happy_elf','6a.war','going_tothe_moon','home_ford88','269_grand_pcxpcx','kangi.toon','flow.itself','successnote','namui.sajeong_ssultoon'];
const cards=['ai_margin_','platformtree_','sliq_ai'];
const entries=[...reels.map(name=>({name,type:'reels',url:`https://www.instagram.com/${name}/${['6a.war','going_tothe_moon','successnote'].includes(name)?'':'reels/'}`})),...cards.map(name=>({name,type:'cards',url:`https://www.instagram.com/${name}/`}))];
let filter='all';const content=document.querySelector('#content');const search=document.querySelector('#search');
function render(){const q=search.value.toLowerCase().trim();const selected=entries.filter(e=>(filter==='all'||e.type===filter)&&e.name.toLowerCase().includes(q));content.replaceChildren();for(const [type,title] of [['reels','원페이지 릴스 · 카드뉴스'],['cards','카드뉴스 전문 참고용']]){const list=selected.filter(e=>e.type===type);if(!list.length)continue;const h=document.createElement('h2');h.textContent=`${title} (${list.length})`;content.append(h);const grid=document.createElement('div');grid.className='grid';for(const e of list){const a=document.createElement('a');a.className='item';a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';const name=document.createElement('span');name.className='handle';name.textContent='@'+e.name;const go=document.createElement('span');go.className='go';go.textContent='인스타그램 열기 ↗';a.append(name,go);grid.append(a)}content.append(grid)}if(!selected.length){const p=document.createElement('p');p.textContent='검색 결과가 없습니다.';content.append(p)}}
search.addEventListener('input',render);document.querySelectorAll('button[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('button[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));render();
</script></body></html>
